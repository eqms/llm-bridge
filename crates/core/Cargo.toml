[package]
name = "llm-bridge-core"
description = "OpenAI-kompatibler Mini-Proxy für Anthropic-Messages-Endpunkte (z. B. LangDock)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "http2"] }
# TLS-Krypto über ring statt aws-lc-rs (reqwest-Standard): kein C/NASM-Build nötig
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
async-stream = "0.3"
eventsource-stream = "0.2"
bytes = "1"
toml = "1"
thiserror = "2"
directories = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

# Feature `v1` wählt den Speicher je Plattform: macOS Keychain, Windows Anmeldeinformationsverwaltung,
# Linux Secret Service (zbus, ohne libdbus)
keyring = "4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
