name: Release

# A tag `v<version>` builds all platforms and creates a draft release.
# A manual run builds (and signs) everything but publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.0"
  TAURI_CLI_VERSION: "2.12.1"
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # LINUX_DEPS is a space-separated package list
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Tauri CLI
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked

      # Developer ID certificate into a throwaway keychain; notarization uses an
      # App Store Connect API key. Tauri and the CLI signing below both use it.
      - name: Signing setup (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY APPLE_API_ISSUER; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is missing"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # one argument per existing keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 -o '"Developer ID Application: [^"]*"' | tr -d '"')
          [ -n "$identity" ] || { echo "::error::No Developer ID Application certificate in APPLE_CERTIFICATE"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build app
        working-directory: app/src-tauri
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --locked -p llm-bridge-cli --target ${{ matrix.target }}

      - name: Package (macOS) — sign and notarize CLI and DMG
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir dist
          auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          # Submit once, then wait separately: a network drop while polling (seen on hosted
          # runners) retries the wait instead of failing the job or submitting again.
          notarize() {
            local id status attempt
            id=$(xcrun notarytool submit "$1" "${auth[@]}" --output-format json | jq -r .id)
            [ -n "$id" ] && [ "$id" != null ] || { echo "::error::Submission of $1 failed"; return 1; }
            echo "Submitted $1 as $id"
            for attempt in 1 2 3 4 5 6; do
              xcrun notarytool wait "$id" "${auth[@]}" --timeout 2h > /dev/null && break
              echo "::warning::Waiting for $id failed (attempt $attempt), retrying in 60 s"
              sleep 60
            done
            status=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | jq -r .status)
            if [ "$status" != Accepted ]; then
              echo "::error::Notarization of $1 ended with status $status"
              xcrun notarytool log "$id" "${auth[@]}" || true
              return 1
            fi
          }
          bin="target/$TARGET/release/llm-bridge"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          ditto -c -k "$bin" "dist/llm-bridge-cli-$TARGET.zip"
          notarize "dist/llm-bridge-cli-$TARGET.zip"
          for dmg in "target/$TARGET/release/bundle/dmg/"*.dmg; do
            out="dist/$(basename "$dmg")"
            cp "$dmg" "$out"
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$out"
            notarize "$out"
            xcrun stapler staple "$out"
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          7z a -tzip "dist/llm-bridge-cli-$TARGET.zip" "./target/$TARGET/release/llm-bridge.exe"
          cp "target/$TARGET/release/bundle/msi/"*.msi "target/$TARGET/release/bundle/nsis/"*.exe dist/

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/llm-bridge-cli-$TARGET.tar.gz" -C "target/$TARGET/release" llm-bridge
          cp "target/$TARGET/release/bundle/deb/"*.deb "target/$TARGET/release/bundle/rpm/"*.rpm \
             "target/$TARGET/release/bundle/appimage/"*.AppImage dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Remove signing material (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "LLM Bridge ${GITHUB_REF_NAME#v}" --generate-notes
