# cargo-deny configuration — run with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
ignore = [
    # Comes in through Tauri's GTK3 stack on Linux; there is no fix we can apply.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; pulled in by glib/gtk3 macros via tauri (Linux only)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only. MPL-2.0 is file-level copyleft (cssparser/selectors via tauri)
# and allows binary distribution of unmodified sources.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Tauri pulls many duplicate versions (windows-sys, bitflags, …) that we cannot unify.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
